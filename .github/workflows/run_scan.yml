name: Run engagement scan

on:
  workflow_dispatch:
    inputs:
      layer:
        description: "Which layer to run"
        required: true
        default: "both"
        type: choice
        options: [layer1, layer2, both]
  schedule:
    - cron: "0 13 * * *"  # daily at 13:00 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run Layer 1 (influencer scan)
        if: ${{ inputs.layer == 'layer1' || inputs.layer == 'both' || github.event_name == 'schedule' }}
        env:
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python layer1_influencer_scan.py

      - name: Run Layer 2 (lead re-scan)
        if: ${{ inputs.layer == 'layer2' || inputs.layer == 'both' || github.event_name == 'schedule' }}
        env:
          LEAD_API_KEY: ${{ secrets.LEAD_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python layer2_lead_rescan.py

      - name: Rebuild dashboard
        run: python render_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Update dashboard from scheduled scan"
          git push
